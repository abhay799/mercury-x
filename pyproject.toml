[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mercury-x"
version = "0.0.0"
description = "Research-oriented CPU-first control plane for deterministic AI workload orchestration"
requires-python = ">=3.13,<3.14"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
include = ["mercury*"]
